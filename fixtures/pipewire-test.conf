context.properties = {
    core.daemon = true
    core.name = hearth-test
    support.dbus = false
    mem.allow-mlock = false
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
]
context.objects = [
    { factory = metadata args = {
        metadata.name = default
        metadata.values = [
            { key = default.audio.sink type = "Spa:String:JSON" value = "{\"name\":\"hearth.test.sink\"}" }
            { key = default.audio.source type = "Spa:String:JSON" value = "{\"name\":\"hearth.test.source\"}" }
        ]
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = hearth.test.sink
        node.description = "Private test sink"
        media.class = Audio/Sink
        audio.position = [ FL FR ]
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
        node.param.Props = { channelVolumes = [ 1.0 1.0 ] mute = false }
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = hearth.test.source
        node.description = "Private test source"
        media.class = Audio/Source/Virtual
        audio.position = [ FL FR ]
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
        node.param.Props = { channelVolumes = [ 1.0 1.0 ] mute = false }
    } }
]
