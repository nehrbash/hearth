[package]
name = "hearth"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native scene graph and Weft workspace UI"

[dependencies]
anyhow = "1"
pollster = "0.4"
png = "0.18"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
smithay-client-toolkit = "0.20"
wayland-client = { version = "0.31", features = ["system"] }
wgpu = { version = "26", default-features = false, features = ["std", "vulkan", "wgsl"] }

[lints.clippy]
unwrap_used = "deny"

[profile.dev]
debug = 1
